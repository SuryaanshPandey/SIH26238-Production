plugins {
    id 'com.android.application'
}

def studentAppUrl = (
        project.findProperty('studentAppUrl')
                ?: 'https://sih26238-student-v25-free.onrender.com'
).toString().trim()

def allowCleartext = (
        project.findProperty('allowCleartext')
                ?: 'false'
).toString().toBoolean()

def mobileOpsUrl = (
        project.findProperty('mobileOpsUrl')
                ?: 'https://sih26238-operations-v25-free.onrender.com/api/v1'
).toString().trim()

def mobileVerificationUrl = (
        project.findProperty('mobileVerificationUrl')
                ?: 'https://sih26238-verification-v25-free.onrender.com'
).toString().trim()

def quoteBuildConfig = { String value ->
    return '"' +
            value
                    .replace('\\', '\\\\')
                    .replace('"', '\\"') +
            '"'
}

android {
    namespace 'in.sih26238.mobile'

    compileSdk 37

    defaultConfig {
        applicationId 'in.sih26238.mobile'

        minSdk 26
        targetSdk 37

        /*
         * Incremented after the production-runtime guard fix so this APK
         * cannot be confused with the previous WebView build.
         */
        versionCode 27
        versionName '25.0.2'

        buildConfigField(
                'String',
                'STUDENT_APP_URL',
                quoteBuildConfig(studentAppUrl)
        )

        buildConfigField(
                'String',
                'MOBILE_OPS_URL',
                quoteBuildConfig(mobileOpsUrl)
        )

        buildConfigField(
                'String',
                'MOBILE_VERIFICATION_URL',
                quoteBuildConfig(mobileVerificationUrl)
        )

        manifestPlaceholders.allowCleartextTraffic =
                allowCleartext
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }

        release {
            /*
             * Installable SIH/demo APK.
             *
             * This uses the debug signing key deliberately for direct
             * installation/demo distribution. A Play Store release
             * requires replacing this with a dedicated release keystore.
             */
            signingConfig signingConfigs.debug

            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*'
            ]
        }
    }
}
