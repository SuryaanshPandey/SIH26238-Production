name: Build SIH26238 Android APK

on:
  workflow_dispatch:
    inputs:
      student_app_url:
        description: "Public Student App URL"
        required: true
        default: "https://sih26238-student-v25-free.onrender.com"

      operations_url:
        description: "Operations API base URL"
        required: true
        default: "https://sih26238-operations-v25-free.onrender.com/api/v1"

      verification_url:
        description: "Verification service URL"
        required: true
        default: "https://sih26238-verification-v25-free.onrender.com"

jobs:
  build:
    name: Build SIH26238 Release APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout render-stability
        uses: actions/checkout@v5
        with:
          ref: render-stability
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo ""

          if [ ! -d "${ANDROID_SDK_ROOT}" ]; then
            echo "ERROR: Android SDK directory does not exist."
            exit 1
          fi

          SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | sort -V | tail -n 1)"

          if [ -z "${SDKMANAGER}" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "${SDKMANAGER}"
          echo ""

          "${SDKMANAGER}" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | sort -V | tail -n 1)"

          if [ -z "${SDKMANAGER}" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          yes | "${SDKMANAGER}" --licenses >/tmp/android-licenses.log 2>&1 || {
            cat /tmp/android-licenses.log
            exit 1
          }

          tail -n 20 /tmp/android-licenses.log

          echo ""
          echo "Android SDK licenses accepted."

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | sort -V | tail -n 1)"

          if [ -z "${SDKMANAGER}" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Installing required Android SDK packages..."

          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Verify Android build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed Android SDK packages:"
          echo ""

          SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | sort -V | tail -n 1)"

          "${SDKMANAGER}" --list_installed 2>/dev/null || true

          echo ""
          echo "Checking required packages..."

          if [ ! -d "${ANDROID_SDK_ROOT}/platforms/android-37" ]; then
            echo "ERROR: Android platform 37 is missing."
            exit 1
          fi

          if [ ! -d "${ANDROID_SDK_ROOT}/build-tools/36.0.0" ]; then
            echo "ERROR: Android Build Tools 36.0.0 are missing."
            exit 1
          fi

          if [ ! -d "${ANDROID_SDK_ROOT}/platform-tools" ]; then
            echo "ERROR: Android platform-tools are missing."
            exit 1
          fi

          echo ""
          echo "Android SDK environment verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android project..."

          test -f mobile-app/android/settings.gradle
          test -f mobile-app/android/build.gradle
          test -f mobile-app/android/app/build.gradle
          test -f mobile-app/android/app/src/main/AndroidManifest.xml

          echo "Android project files found."

      - name: Clean Android build
        working-directory: mobile-app/android
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning Android project..."

          gradle clean

      - name: Build installable release APK
        working-directory: mobile-app/android
        shell: bash
        run: |
          set -euo pipefail

          echo "Building SIH26238 release APK..."
          echo ""

          gradle :app:assembleRelease \
            --stacktrace \
            -PstudentAppUrl="${{ inputs.student_app_url }}" \
            -PmobileOpsUrl="${{ inputs.operations_url }}" \
            -PmobileVerificationUrl="${{ inputs.verification_url }}" \
            -PallowCleartext=false

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="mobile-app/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "${APK}" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Expected:"
            echo "${APK}"
            exit 1
          fi

          echo "APK generated successfully."
          echo ""

          ls -lh "${APK}"

          echo ""
          echo "SHA-256:"
          sha256sum "${APK}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIH26238-v25-apk
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build complete
        shell: bash
        run: |
          echo ""
          echo "=============================================================="
          echo "SIH26238 ANDROID APK BUILD COMPLETED"
          echo "=============================================================="
          echo ""
          echo "Student App:"
          echo "${{ inputs.student_app_url }}"
          echo ""
          echo "Operations API:"
          echo "${{ inputs.operations_url }}"
          echo ""
          echo "Verification:"
          echo "${{ inputs.verification_url }}"
          echo ""
          echo "APK artifact:"
          echo "SIH26238-v25-apk"
          echo ""
          echo "=============================================================="
