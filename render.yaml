services:
  - type: web
    name: sih26238-student-v25-free
    runtime: node
    plan: free
    rootDir: student-app
    buildCommand: npm ci --include=dev && npm run build
    startCommand: bash render-start.sh
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_USE_LIVE_BACKEND
        value: "true"
      - key: NEXT_PUBLIC_RIJVAN_API_URL
        value: "https://sih26238-operations-v25-free.onrender.com/api/v1"
      - key: NEXT_PUBLIC_VERIFICATION_API_URL
        value: "https://sih26238-verification-v25-free.onrender.com"

   - type: web
    name: sih26238-operations-v25-free
    runtime: node
    plan: free
    rootDir: operations
    buildCommand: npm ci --include=dev && npm run prisma:migrate && npm run build
    startCommand: bash render-start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: REAL_DATA_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: STUDENT_APP_ORIGIN
        value: "https://sih26238-student-v25-free.onrender.com"
      - key: VERIFICATION_SERVICE_URL
        value: "https://sih26238-verification-v25-free.onrender.com"
      - key: DOCUMENT_SERVICE_URL
        value: "https://sih26238-verification-v25-free.onrender.com"
      - key: DIGILOCKER_OAUTH_REDIRECT_URI
        value: "https://sih26238-operations-v25-free.onrender.com/api/v1/government/digilocker/callback"
      - key: NSP_SOURCE_URL
        value: "https://scholarships.gov.in/All-Scholarships"
      - key: SCHOLARSHIP_ACADEMIC_YEAR
        value: "2026-2027"
      - key: NSP_SOURCE_TIMEOUT_MS
        value: "8000"
      - key: SCHOLARSHIP_SOURCE_TIMEOUT_MS
        value: "9000"
      - key: SCHOLARSHIP_DETAIL_TIMEOUT_MS
        value: "6500"
      - key: SCHOLARSHIP_SOURCE_RETRIES
        value: "2"
      - key: JAGO_HISTORY_TIMEOUT_MS
        value: "350"
      - key: JAGO_CONTEXT_TIMEOUT_MS
        value: "3500"
      - key: JAGO_RESPONSE_TIMEOUT_MS
        value: "7000"
      - key: CONTRACT_VERSION
        value: "v1"
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: sih26238-verification-v25-free
    runtime: python
    plan: free
    rootDir: verification
    buildCommand: pip install -r requirements.txt
    startCommand: bash render-start.sh
    healthCheckPath: /health
    envVars:
      - key: SIH_STORAGE_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: SIH_DOCUMENT_STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: sih26238-documents
      - key: SIH_REQUIRE_CONSENT
        value: "true"
      - key: SIH_REAL_DATA_MODE
        value: "true"
      - key: SIH_CORS_ORIGINS
        value: "https://sih26238-student-v25-free.onrender.com"
